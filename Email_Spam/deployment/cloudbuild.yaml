substitutions:
  _REGION: europe-central2
  _REPOSITORY: ml-models
  _SERVICE: email-spam-api

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Email_Spam/deployment/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:latest
